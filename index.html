<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f2" />
    <meta name="description" content="Keep every car service and cost in one place." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maintainr" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Maintainr — your car, kept up</title>
  </head>
  <body>
    <div id="app"></div>
    <dialog id="record-dialog" aria-labelledby="dialog-title">
      <form id="record-form" method="dialog">
        <div class="dialog-heading">
          <div><p class="eyebrow" id="dialog-kicker">NEW RECORD</p><h2 id="dialog-title">Add a service</h2></div>
          <button class="icon-button close-dialog" type="button" aria-label="Close dialog" data-icon="close"></button>
        </div>
        <div id="form-fields"></div>
        <div class="form-actions"><button class="button button-quiet close-dialog" type="button">Cancel</button><button class="button button-primary" type="submit">Save record <span data-icon="arrow"></span></button></div>
      </form>
    </dialog>
    <script src="/app.js" defer></script>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));</script>
  </body>
</html>
